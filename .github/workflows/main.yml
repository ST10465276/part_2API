
name: API Build and Unit Tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PART2/part_2API.slnx

      - name: Build API and test project
        run: dotnet build PART2/part_2API.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test PART2/part_2API.slnx --configuration Release --no-build
